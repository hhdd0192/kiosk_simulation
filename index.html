<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키오스크 UX 비교 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
        body { background-color: #2c3e50; color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 상단 네비게이션 */
        header { background: #1a252f; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        h1 { font-size: 1.1rem; }
        .mode-toggle-group { display: flex; gap: 8px; }
        .mode-btn { background: #34495e; border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .mode-btn.active { background: #e74c3c; }

        /* 메인 컨테이너 */
        .main-container { display: flex; flex: 1; overflow: hidden; background: #dcdde1; gap: 10px; padding: 10px; }
        .kiosk-panel { flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }

        /* 키오스크 화면 내부 프레임 */
        .kiosk-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: #fafafa; }
        
        /* 상단 상태바 */
        .kiosk-status-bar { background: #333; color: white; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        
        /* [개선 후] 상단 3단계 과정 표시바 */
        .process-stepper-bar { display: flex; background: #27ae60; color: white; font-weight: bold; font-size: 0.9rem; text-align: center; border-bottom: 2px solid #1e8449; }
        .p-step { flex: 1; padding: 10px 4px; opacity: 0.5; background: #219653; transition: 0.3s; }
        .p-step.active { opacity: 1; background: #27ae60; color: #fff; border-bottom: 4px solid #f1c40f; font-size: 1rem; }

        /* 카테고리 탭 */
        .category-tabs { display: flex; background: #eee; overflow-x: auto; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        .cat-tab { padding: 10px 14px; cursor: pointer; border: none; background: none; font-weight: bold; font-size: 0.9rem; white-space: nowrap; color: #555; }
        .cat-tab.active { background: #fff; color: #e74c3c; border-bottom: 3px solid #e74c3c; }
        .after .cat-tab.active { color: #27ae60; border-bottom: 4px solid #27ae60; font-size: 1.1rem; }

        /* 메뉴 그리드 영역 */
        .menu-grid-area { flex: 1; overflow-y: auto; padding: 10px; display: grid; gap: 8px; }
        
        /* 개선 전: 빽빽한 그리드 */
        .before-grid { grid-template-columns: repeat(4, 1fr); }
        .before-grid .menu-card { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; cursor: pointer; text-align: center; }
        .before-grid .menu-card:hover { border-color: #e74c3c; }
        .before-grid .menu-img { width: 100%; height: 50px; background: #f1f2f6; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 4px; }
        .before-grid .menu-name { font-size: 0.75rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .before-grid .menu-info { font-size: 0.65rem; color: #888; display: flex; justify-content: space-between; margin-top: 2px; }

        /* 개선 후: 시원한 그리드 */
        .after-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .after-grid .menu-card { background: #fff; border: 2px solid #27ae60; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.05); }
        .after-grid .menu-card:hover { background: #f0f9f4; transform: translateY(-2px); }
        .after-grid .menu-img { width: 100%; height: 80px; background: #e2f0ea; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 8px; }
        .after-grid .menu-name { font-size: 1.1rem; font-weight: bold; color: #2c3e50; margin-bottom: 4px; }
        .after-grid .menu-price { font-size: 1.05rem; font-weight: bold; color: #e74c3c; }

        /* 하단 장바구니 영역 */
        .cart-bar { background: #fff; border-top: 2px solid #ddd; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .cart-info { font-size: 0.9rem; font-weight: bold; }
        .checkout-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .after .checkout-btn { background: #27ae60; font-size: 1.1rem; padding: 12px 24px; border-radius: 8px; }

        /* 모달 스타일 */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: #fff; width: 90%; max-width: 440px; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .modal-header { background: #333; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .modal-body { padding: 15px; max-height: 60vh; overflow-y: auto; font-size: 0.9rem; }
        .modal-footer { padding: 10px 15px; background: #f1f1f1; display: flex; justify-content: flex-end; gap: 8px; }

        /* 개선 전 결제 모달 */
        .before-payment-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
        .pay-option-btn { padding: 10px; border: 1px solid #ccc; background: #fff; border-radius: 4px; text-align: center; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .pay-option-btn:hover { background: #ffeaa7; border-color: #fdcb6e; }

        /* 개선 후 결제 모달 스테퍼 */
        .stepper-header { display: flex; justify-content: space-between; background: #27ae60; color: white; padding: 8px; font-size: 0.8rem; font-weight: bold; text-align: center; }
        .step-pill { flex: 1; padding: 4px; opacity: 0.5; border-bottom: 3px solid transparent; }
        .step-pill.active { opacity: 1; border-bottom: 3px solid #ffeaa7; font-size: 0.88rem; }
    </style>
</head>
<body>

    <header>
        <h1>🖥️ 키오스크 UX 비교 시뮬레이터</h1>
        <div class="mode-toggle-group">
            <button class="mode-btn active" onclick="switchView('side', event)">좌우 비교 보기</button>
            <button class="mode-btn" onclick="switchView('before', event)">개선 전만 보기</button>
            <button class="mode-btn" onclick="switchView('after', event)">개선 후만 보기</button>
        </div>
    </header>

    <div class="main-container" id="mainContainer">
        <!-- ==================== 개선 전 패널 ==================== -->
        <div class="kiosk-panel" id="panelBefore">
            <div class="kiosk-screen">
                <div class="kiosk-status-bar">
                    <span>주문번호 001</span>
                    <span style="color: #ff7675;">⏱️ 제한시간 45초</span>
                </div>
                <div class="category-tabs" id="tabsBefore">
                    <button class="cat-tab active" onclick="filterMenu('before', 'burger', event)">버거/세트</button>
                    <button class="cat-tab" onclick="filterMenu('before', 'side', event)">사이드</button>
                    <button class="cat-tab" onclick="filterMenu('before', 'drink', event)">음료</button>
                    <button class="cat-tab" onclick="filterMenu('before', 'dessert', event)">디저트</button>
                </div>
                <div class="menu-grid-area before-grid" id="gridBefore"></div>
                <div class="cart-bar">
                    <div class="cart-info" id="cartInfoBefore">선택: 0개 | 0원</div>
                    <button class="checkout-btn" onclick="openPayment('before')">결제하기</button>
                </div>
            </div>
        </div>

        <!-- ==================== 개선 후 패널 ==================== -->
        <div class="kiosk-panel" id="panelAfter">
            <div class="kiosk-screen after">
                <!-- 상단 주문 과정 진행바 -->
                <div class="process-stepper-bar">
                    <div class="p-step active" id="pStep1">1. 메뉴 선택 중</div>
                    <div class="p-step" id="pStep2">2. 담은 목록 확인</div>
                    <div class="p-step" id="pStep3">3. 결제 진행 중</div>
                </div>

                <div class="kiosk-status-bar" style="background: #219653;">
                    <span>🙋‍♂️ 어르신 쉬운 모드</span>
                    <div>
                        <button onclick="toggleTTS()" id="ttsBtn" style="background:#fff; color:#27ae60; border:none; padding:2px 6px; border-radius:4px; font-weight:bold; cursor:pointer;">🔊 음성 켜짐</button>
                        <button onclick="openHelp()" style="background:#e67e22; color:#fff; border:none; padding:2px 6px; border-radius:4px; font-weight:bold; cursor:pointer; margin-left:5px;">직원호출</button>
                    </div>
                </div>
                <div class="category-tabs" id="tabsAfter">
                    <button class="cat-tab active" onclick="filterMenu('after', 'burger', event)">🍔 버거/세트</button>
                    <button class="cat-tab" onclick="filterMenu('after', 'side', event)">🍟 사이드</button>
                    <button class="cat-tab" onclick="filterMenu('after', 'drink', event)">🥤 음료</button>
                    <button class="cat-tab" onclick="filterMenu('after', 'dessert', event)">🍦 디저트</button>
                </div>
                <div class="menu-grid-area after-grid" id="gridAfter"></div>
                <div class="cart-bar">
                    <div class="cart-info" id="cartInfoAfter" style="font-size: 1.1rem;">총 0원</div>
                    <button class="checkout-btn" onclick="openPayment('after')">주문하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 개선 전 결제 모달 -->
    <div class="modal-overlay" id="modalBefore">
        <div class="modal-box">
            <div class="modal-header">
                <span>결제수단 및 할인 선택</span>
                <span style="cursor:pointer;" onclick="closeModal('before')">✕</span>
            </div>
            <div class="modal-body">
                <p style="font-weight: bold; color: #c0392b; font-size: 0.85rem; margin-bottom: 4px;">STEP 1. 제휴할인을 선택해주세요.</p>
                <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                    <div class="pay-option-btn" style="flex:1;">KT VIP 할인</div>
                    <div class="pay-option-btn" style="flex:1;">SKT 우주패스</div>
                </div>
                <p style="font-weight: bold; color: #c0392b; font-size: 0.85rem; margin-bottom: 4px;">STEP 2. 결제수단을 선택해주세요.</p>
                <div class="before-payment-grid">
                    <div class="pay-option-btn" onclick="completePayment('신용카드')">💳 신용카드</div>
                    <div class="pay-option-btn" onclick="completePayment('앱카드')">📱 앱카드</div>
                    <div class="pay-option-btn" onclick="completePayment('카카오페이')">💛 카카오페이</div>
                    <div class="pay-option-btn" onclick="completePayment('페이코')">❤️ 페이코(PAYCO)</div>
                    <div class="pay-option-btn" onclick="completePayment('네이버페이')">💚 네이버페이</div>
                    <div class="pay-option-btn" onclick="completePayment('제로페이')">제로페이</div>
                    <div class="pay-option-btn" onclick="completePayment('쿠폰사용')">✨ 쿠폰/기프티콘</div>
                    <div class="pay-option-btn" onclick="completePayment('하나페이')">하나페이</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 개선 후 4단계 순차 결제 모달 -->
    <div class="modal-overlay" id="modalAfter">
        <div class="modal-box" style="max-width: 460px;">
            <div class="modal-header" style="background: #27ae60;">
                <span id="stepTitle">STEP 1: 제휴 할인 선택</span>
                <span style="cursor:pointer;" onclick="closeModal('after')">✕</span>
            </div>
            <div class="stepper-header">
                <div class="step-pill" id="pill1">1. 제휴할인</div>
                <div class="step-pill" id="pill2">2. 쿠폰</div>
                <div class="step-pill" id="pill3">3. 결제수단</div>
                <div class="step-pill" id="pill4">4. 완료</div>
            </div>
            <div class="modal-body" id="afterStepBody" style="min-height: 200px;">
                <!-- 동적 생성 -->
            </div>
            <div class="modal-footer">
                <button id="prevStepBtn" onclick="prevStep()" style="padding: 8px 14px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer; display:none;">이전 단계</button>
                <button id="nextStepBtn" onclick="nextStep()" style="padding: 8px 16px; background:#27ae60; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">다음 단계 / 건너뛰기</button>
            </div>
        </div>
    </div>

    <script>
        // 메뉴 데이터
        const menuData = {
            burger: [
                { id: 1, name: "한우불고기버거", price: 7500, cal: "560kcal", img: "🍔" },
                { id: 2, name: "치즈버거 세트", price: 6000, cal: "680kcal", img: "🍔" },
                { id: 3, name: "불고기버거 세트", price: 5500, cal: "620kcal", img: "🍔" },
                { id: 4, name: "새우버거 세트", price: 5800, cal: "590kcal", img: "🍔" },
                { id: 5, name: "더블치즈버거", price: 6500, cal: "750kcal", img: "🍔" },
                { id: 6, name: "핫크리스피버거", price: 6800, cal: "710kcal", img: "🍔" },
                { id: 7, name: "베이컨토마토버거", price: 7200, cal: "690kcal", img: "🍔" },
                { id: 8, name: "상하이버거", price: 6300, cal: "640kcal", img: "🍔" }
            ],
            side: [
                { id: 9, name: "프렌치프라이(L)", price: 2500, cal: "350kcal", img: "🍟" },
                { id: 10, name: "치즈스틱(2조각)", price: 2200, cal: "190kcal", img: "🧀" },
                { id: 11, name: "치킨너겟(4조각)", price: 2500, cal: "210kcal", img: "🍗" },
                { id: 12, name: "콘샐러드", price: 2000, cal: "160kcal", img: "🥗" }
            ],
            drink: [
                { id: 13, name: "코카콜라(R)", price: 2000, cal: "140kcal", img: "🥤" },
                { id: 14, name: "사이다(R)", price: 2000, cal: "140kcal", img: "🥤" },
                { id: 15, name: "오렌지주스", price: 2800, cal: "120kcal", img: "🧃" },
                { id: 16, name: "아이스 아메리카노", price: 2500, cal: "10kcal", img: "☕" }
            ],
            dessert: [
                { id: 17, name: "소프트 아이스크림", price: 1500, cal: "220kcal", img: "🍦" },
                { id: 18, name: "초코 선데", price: 2000, cal: "310kcal", img: "🍨" },
                { id: 19, name: "애플파이", price: 1800, cal: "250kcal", img: "🥧" }
            ]
        };

        let currentCatBefore = 'burger';
        let currentCatAfter = 'burger';
        let cart = [];
        let ttsEnabled = true;
        let currentAfterStep = 1;

        function setMainProcessStep(stepNum) {
            document.querySelectorAll('.p-step').forEach((s, idx) => {
                s.classList.toggle('active', idx + 1 === stepNum);
            });
        }

        function renderMenus() {
            // 개선 전 렌더링
            const gridBefore = document.getElementById('gridBefore');
            gridBefore.innerHTML = menuData[currentCatBefore].map(item => `
                <div class="menu-card" onclick="addToCart('${item.name}', ${item.price})">
                    <div class="menu-img">${item.img}</div>
                    <div class="menu-name">${item.name}</div>
                    <div class="menu-info"><span>${item.price.toLocaleString()}원</span><span>${item.cal}</span></div>
                </div>
            `).join('');

            // 개선 후 렌더링
            const gridAfter = document.getElementById('gridAfter');
            gridAfter.innerHTML = menuData[currentCatAfter].map(item => `
                <div class="menu-card" onclick="addToCart('${item.name}', ${item.price})">
                    <div class="menu-img">${item.img}</div>
                    <div class="menu-name">${item.name}</div>
                    <div class="menu-price">${item.price.toLocaleString()}원</div>
                </div>
            `).join('');
        }

        function filterMenu(mode, cat, evt) {
            if(mode === 'before') {
                currentCatBefore = cat;
                document.querySelectorAll('#tabsBefore .cat-tab').forEach(t => t.classList.remove('active'));
                if (evt) evt.target.classList.add('active');
            } else {
                currentCatAfter = cat;
                document.querySelectorAll('#tabsAfter .cat-tab').forEach(t => t.classList.remove('active'));
                if (evt) evt.target.classList.add('active');
            }
            renderMenus();
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCartUI();
            setMainProcessStep(2);
            if(ttsEnabled && 'speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(name + "가 담겼습니다.");
                utterance.lang = 'ko-KR';
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateCartUI() {
            const totalCount = cart.length;
            const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartInfoBefore').innerText = `선택: ${totalCount}개 | ${totalPrice.toLocaleString()}원`;
            document.getElementById('cartInfoAfter').innerText = `총 ${totalPrice.toLocaleString()}원 (${totalCount}개)`;
        }

        function switchView(type, evt) {
            const pb = document.getElementById('panelBefore');
            const pa = document.getElementById('panelAfter');
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (evt) evt.target.classList.add('active');

            if(type === 'side') {
                pb.style.display = 'flex'; pa.style.display = 'flex';
            } else if(type === 'before') {
                pb.style.display = 'flex'; pa.style.display = 'none';
            } else {
                pb.style.display = 'none'; pa.style.display = 'flex';
            }
        }

        function openPayment(mode) {
            if(cart.length === 0) {
                alert("먼저 메뉴를 선택해 주세요!");
                return;
            }
            if(mode === 'before') {
                document.getElementById('modalBefore').style.display = 'flex';
            } else {
                setMainProcessStep(3);
                currentAfterStep = 1;
                renderAfterStep();
                document.getElementById('modalAfter').style.display = 'flex';
            }
        }

        function closeModal(mode) {
            document.getElementById(mode === 'before' ? 'modalBefore' : 'modalAfter').style.display = 'none';
            if(mode === 'after' && cart.length > 0) {
                setMainProcessStep(2);
            }
        }

        function completePayment(method) {
            alert(`[결제 완료] ${method}로 정상 결제되었습니다! 맛있게 준비하겠습니다.`);
            cart = [];
            updateCartUI();
            setMainProcessStep(1);
            closeModal('before');
            closeModal('after');
        }

        function renderAfterStep() {
            for(let i=1; i<=4; i++) {
                document.getElementById(`pill${i}`).className = 'step-pill' + (i === currentAfterStep ? ' active' : '');
            }
            const body = document.getElementById('afterStepBody');
            const prevBtn = document.getElementById('prevStepBtn');
            const nextBtn = document.getElementById('nextStepBtn');

            prevBtn.style.display = currentAfterStep > 1 ? 'block' : 'none';

            if(currentAfterStep === 1) {
                document.getElementById('stepTitle').innerText = 'STEP 1: 제휴 할인 선택';
                body.innerHTML = `
                    <p style="margin-bottom:10px; font-weight:bold; color:#27ae60;">할인 카드가 있으신가요? 없으면 '다음'을 누르세요.</p>
                    <div style="display:flex; gap:10px;">
                        <button onclick="nextStep()" style="flex:1; padding:15px; border:2px solid #27ae60; background:#f0f9f4; border-radius:8px; font-weight:bold; cursor:pointer;">KT 멤버십 할인</button>
                        <button onclick="nextStep()" style="flex:1; padding:15px; border:2px solid #27ae60; background:#f0f9f4; border-radius:8px; font-weight:bold; cursor:pointer;">할인 없음 (다음)</button>
                    </div>
                `;
                nextBtn.innerText = "건너뛰기 / 다음";
            } else if(currentAfterStep === 2) {
                document.getElementById('stepTitle').innerText = 'STEP 2: 쿠폰 / 기프티콘 사용';
                body.innerHTML = `
                    <p style="margin-bottom:10px; font-weight:bold; color:#27ae60;">사용할 모바일 쿠폰이나 바코드가 있으신가요?</p>
                    <div style="display:flex; gap:10px;">
                        <button onclick="nextStep()" style="flex:1; padding:15px; border:2px solid #27ae60; background:#f0f9f4; border-radius:8px; font-weight:bold; cursor:pointer;">📷 쿠폰 바코드 스캔하기</button>
                        <button onclick="nextStep()" style="flex:1; padding:15px; border:2px solid #27ae60; background:#f0f9f4; border-radius:8px; font-weight:bold; cursor:pointer;">쿠폰 없음 (다음)</button>
                    </div>
                `;
                nextBtn.innerText = "쿠폰 없음";
            } else if(currentAfterStep === 3) {
                document.getElementById('stepTitle').innerText = 'STEP 3: 결제 수단 선택';
                body.innerHTML = `
                    <p style="margin-bottom:10px; font-weight:bold; color:#27ae60;">원하시는 결제 방법을 골라주세요.</p>
                    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px;">
                        <button onclick="completePayment('신용/체크카드')" style="padding:15px; background:#27ae60; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1rem;">💳 신용카드 결제</button>
                        <button onclick="completePayment('간편결제')" style="padding:15px; background:#f1c40f; color:#333; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1rem;">📱 간편결제(페이)</button>
                        <button onclick="completePayment('현금결제')" style="padding:15px; background:#e67e22; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1rem;">💵 현금 결제</button>
                        <button onclick="completePayment('상품권')" style="padding:15px; background:#9b59b6; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1rem;">🎟️ 상품권 결제</button>
                    </div>
                `;
                nextBtn.style.display = 'none';
            }
        }

        function nextStep() {
            if(currentAfterStep < 3) {
                currentAfterStep++;
                renderAfterStep();
            }
        }

        function prevStep() {
            if(currentAfterStep > 1) {
                currentAfterStep--;
                renderAfterStep();
            }
        }

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            document.getElementById('ttsBtn').innerText = ttsEnabled ? "🔊 음성 켜짐" : "🔇 음성 꺼짐";
        }

        function openHelp() {
            alert("직원을 호출하였습니다. 잠시만 기다려 주세요!");
        }

        // 초기화
        renderMenus();
    </script>
</body>
</html>
